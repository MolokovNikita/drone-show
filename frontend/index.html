<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Drone Light Show Management System" />
    <title>DroneOS — Light Show Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      :root {
        --bg: #060912;
        --bg2: #0b1120;
        --bg3: #111827;
        --surface: rgba(255,255,255,0.04);
        --surface2: rgba(255,255,255,0.07);
        --border: rgba(255,255,255,0.08);
        --border2: rgba(255,255,255,0.13);
        --cyan: #50c8ff;
        --blue: #6b8fff;
        --amber: #e6b450;
        --green: #73dc82;
        --red: #dc5050;
        --purple: #a064ff;
        --text: rgba(255,255,255,0.92);
        --text2: rgba(255,255,255,0.5);
        --text3: rgba(255,255,255,0.28);
        --sidebar-w: 240px;
        --font: 'Space Grotesk', sans-serif;
        --mono: 'JetBrains Mono', monospace;
      }
      html, body, #root { height: 100%; margin: 0; padding: 0; }
      body { background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

      @keyframes pulse-dot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.5; transform:scale(.75); } }
      @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
      @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
      @keyframes glow-pulse { 0%,100% { box-shadow:0 0 12px rgba(80,200,255,0.3); } 50% { box-shadow:0 0 28px rgba(80,200,255,0.7); } }
      @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
      @keyframes slide-in-left { from { opacity:0; transform:translateX(-20px); } to { opacity:1; transform:translateX(0); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
